<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drake Music Hub</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0f18;
  color: white;
  display: flex;
  height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: 240px;
  background: #11182b;
  padding: 20px;
}

.logo {
  font-size: 22px;
  color: #1db954;
  margin-bottom: 20px;
  font-weight: bold;
}

.song {
  padding: 10px;
  margin-bottom: 8px;
  background: #1a2238;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
}

.song:hover {
  background: #2a375c;
}

/* MAIN */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* PLAYER */
.player {
  width: 500px;
  background: #141c33;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 0 30px rgba(29,185,84,0.2);
}

iframe {
  width: 100%;
  height: 280px;
  border-radius: 10px;
  border: none;
}

/* TITLE */
.title {
  margin-bottom: 10px;
  color: #1db954;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="sidebar">
  <div class="logo">🎧 Drake Hub</div>
  <div id="list"></div>
</div>

<div class="main">
  <div class="player">
    <div class="title" id="title">Select a track</div>

    <iframe id="player" src=""></iframe>
  </div>
</div>

<script>
const tracks = [
  {name:"Drake - God's Plan", id:"xpVfcZ0ZcFM"},
  {name:"Drake - Hotline Bling", id:"uxpDa-c-4Mc"},
  {name:"Drake - One Dance", id:"qL7zrWcv6XY"},
  {name:"Drake - In My Feelings", id:"DRS_PpOrUZ4"},
  {name:"Drake - Nonstop", id:"6ONRf7h3Mdk"},
  {name:"Drake - Started From The Bottom", id:"RVwV7i6Z7Yo"},
  {name:"Drake - Laugh Now Cry Later", id:"JFm7YDVlqnI"},
  {name:"Drake - Passionfruit", id:"EgfsXTOn_pI"}
];

let list = document.getElementById("list");
let player = document.getElementById("player");
let title = document.getElementById("title");

/* render list */
function render(){
  tracks.forEach((t,i)=>{
    let div = document.createElement("div");
    div.className = "song";
    div.innerText = t.name;
    div.onclick = ()=>play(i);
    list.appendChild(div);
  });
}
render();

/* play song */
function play(i){
  title.innerText = tracks[i].name;
  player.src = "https://www.youtube.com/embed/" + tracks[i].id + "?autoplay=1";
}
</script>

</body>
</html>
