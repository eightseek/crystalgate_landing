<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drake Hub</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0f18;
  color: white;
  display: flex;
  height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: 260px;
  background: #11182b;
  padding: 20px;
  overflow-y: auto;
}

.logo {
  font-size: 22px;
  color: #1db954;
  margin-bottom: 15px;
  font-weight: bold;
}

.song {
  padding: 10px;
  margin-bottom: 8px;
  background: #1a2238;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
}

.song:hover {
  background: #2a375c;
}

/* MAIN */
.main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* PLAYER */
.player {
  width: 85%;
  max-width: 900px;
  background: #141c33;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 0 30px rgba(29,185,84,0.15);
}

.title {
  margin-bottom: 15px;
  color: #1db954;
  font-size: 18px;
}

/* BIG VIDEO */
iframe {
  width: 100%;
  height: 560px;
  border-radius: 12px;
  border: none;
}

/* MOBILE */
@media (max-width: 768px) {
  iframe {
    height: 320px;
  }
}
</style>
</head>

<body>

<div class="sidebar">
  <div class="logo">🎧 Drake Hub</div>
  <div id="list"></div>
</div>

<div class="main">
  <div class="player">
    <div class="title" id="title">Select a track</div>
    <iframe id="player" src=""></iframe>
  </div>
</div>

<script>
const tracks = [
  {name:"Drake - God's Plan", id:"xpVfcZ0ZcFM"},
  {name:"Drake - Hotline Bling", id:"uxpDa-c-4Mc"},
  {name:"Drake - In My Feelings", id:"DRS_PpOrUZ4"},
  {name:"Drake - Nonstop", id:"6ONRf7h3Mdk"},
  {name:"Drake - Laugh Now Cry Later", id:"JFm7YDVlqnI"},
  {name:"Drake - Passionfruit", id:"EgfsXTOn_pI"},
  {name:"Drake - Nice For What", id:"U9BwWKXjVaI"},
  {name:"Drake - Controlla", id:"1Lz8LZ2g1v0"},
  {name:"Drake - Started From The Bottom", id:"RVwV7i6Z7Yo"},
  {name:"Drake - Hold On, We're Going Home", id:"7e9pQ3Q1Xn4"}
];

let list = document.getElementById("list");
let player = document.getElementById("player");
let title = document.getElementById("title");

/* render list */
tracks.forEach((t, i) => {
  let div = document.createElement("div");
  div.className = "song";
  div.innerText = t.name;
  div.onclick = () => play(i);
  list.appendChild(div);
});

/* play */
function play(i){
  title.innerText = tracks[i].name;
  player.src = "https://www.youtube.com/embed/" + tracks[i].id + "?autoplay=1&rel=0";
}
</script>

</body>
</html>
