<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drake Hub + Gaming</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0f18;
  color: white;
  display: flex;
  height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: 280px;
  background: #11182b;
  padding: 20px;
  overflow-y: auto;
}

.logo {
  font-size: 22px;
  color: #1db954;
  margin-bottom: 15px;
  font-weight: bold;
}

.section-title {
  margin-top: 20px;
  margin-bottom: 10px;
  font-size: 14px;
  color: #888;
}

/* ITEMS */
.item {
  padding: 10px;
  margin-bottom: 8px;
  background: #1a2238;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
}

.item:hover {
  background: #2a375c;
}

/* MAIN */
.main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* PLAYER */
.player {
  width: 85%;
  max-width: 900px;
  background: #141c33;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
}

.title {
  margin-bottom: 15px;
  color: #1db954;
  font-size: 18px;
}

iframe {
  width: 100%;
  height: 520px;
  border-radius: 12px;
  border: none;
}
</style>
</head>

<body>

<div class="sidebar">
  <div class="logo">🎧 Hub</div>

  <div class="section-title">🎵 MUSIC</div>
  <div id="musicList"></div>

  <div class="section-title">🎮 GAMING HUB (CS2)</div>
  <div id="gameList"></div>
</div>

<div class="main">
  <div class="player">
    <div class="title" id="title">Select something</div>
    <iframe id="player" src=""></iframe>
  </div>
</div>

<script>

/* MUSIC */
const music = [
  {name:"Drake - God's Plan", id:"xpVfcZ0ZcFM"},
  {name:"Drake - Hotline Bling", id:"uxpDa-c-4Mc"},
  {name:"Drake - In My Feelings", id:"DRS_PpOrUZ4"},
  {name:"Drake - Nonstop", id:"6ONRf7h3Mdk"}
];

/* CS2 MATCHES (YouTube links) */
const cs2 = [
  {name:"CS2 - NAVI vs FaZe (Highlights)", id:"ol3_Vv2ZjQc"},
  {name:"CS2 - Vitality vs G2 Full Match", id:"8kQmF1d7QX0"},
  {name:"CS2 - Major Final Highlights", id:"3QpT7c8hZpA"},
  {name:"CS2 - Best Clutches 2025", id:"Lx9vY2mK0pQ"}
];

let player = document.getElementById("player");
let title = document.getElementById("title");

function render(list, container, type){
  let el = document.getElementById(container);

  list.forEach((t)=>{
    let div = document.createElement("div");
    div.className = "item";
    div.innerText = t.name;

    div.onclick = () => {
      title.innerText = t.name;
      player.src = "https://www.youtube.com/embed/" + t.id + "?autoplay=1&rel=0";
    };

    el.appendChild(div);
  });
}

render(music, "musicList");
render(cs2, "gameList");

</script>

</body>
</html>
