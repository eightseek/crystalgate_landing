<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrystalGate VPN</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f1a;
  color: white;
}

/* HERO */
.hero {
  text-align: center;
  padding: 80px 20px;
  background: radial-gradient(circle at top, #1a2a6c, #0b0f1a);
}

.hero h1 {
  font-size: 48px;
  margin-bottom: 10px;
}

.hero p {
  color: #aaa;
  font-size: 18px;
}

/* BUTTON */
.btn {
  display: inline-block;
  padding: 12px 25px;
  margin-top: 20px;
  background: #00ffd5;
  color: black;
  font-weight: bold;
  border-radius: 8px;
  text-decoration: none;
}

/* PLANS */
.plans {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 60px 20px;
  flex-wrap: wrap;
}

.plan {
  background: #111827;
  padding: 25px;
  border-radius: 12px;
  width: 250px;
  text-align: center;
  border: 1px solid #1f2937;
  transition: 0.3s;
}

.plan:hover {
  transform: translateY(-5px);
  border-color: #00ffd5;
}

.price {
  font-size: 28px;
  margin: 10px 0;
  color: #00ffd5;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 30px;
  color: #666;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="hero">
  <h1>CrystalGate VPN</h1>
  <p>Fast • Secure • No Logs • Worldwide Access</p>
  <a class="btn" href="#plans">Get Started</a>
</div>

<div id="plans" class="plans">

  <div class="plan">
    <h3>Basic</h3>
    <div class="price">$5</div>
    <p>1 Month</p>
    <p>Single Device</p>
    <a class="btn" href="#">Buy</a>
  </div>

  <div class="plan">
    <h3>Pro</h3>
    <div class="price">$10</div>
    <p>1 Month</p>
    <p>3 Devices</p>
    <a class="btn" href="#">Buy</a>
  </div>

  <div class="plan">
    <h3>Elite</h3>
    <div class="price">$20</div>
    <p>3 Months</p>
    <p>Unlimited Devices</p>
    <a class="btn" href="#">Buy</a>
  </div>

</div>

<footer>
  © 2026 CrystalGate VPN - All rights reserved
</footer>

</body>
</html>
