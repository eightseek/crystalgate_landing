<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeoMusic Player</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0f1a;
  color: white;
  text-align: center;
}

header {
  padding: 30px;
  font-size: 28px;
  color: #00ffd5;
}

.player {
  margin: 40px auto;
  padding: 20px;
  width: 320px;
  background: #141827;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(0,255,213,0.2);
}

button {
  padding: 10px 15px;
  margin: 5px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: #00ffd5;
  color: black;
  font-weight: bold;
}

.tracklist {
  margin-top: 30px;
}

.track {
  padding: 10px;
  margin: 5px;
  background: #1c2238;
  border-radius: 8px;
  cursor: pointer;
}

.track:hover {
  background: #2a3352;
}
</style>
</head>

<body>

<header>NeoMusic Player 🎧</header>

<div class="player">

  <h3 id="title">No Track</h3>

  <audio id="audio" controls style="width:100%; margin-top:10px;">
    <source id="source" src="" type="audio/mp3">
  </audio>

  <div>
    <button onclick="playAudio()">Play</button>
    <button onclick="pauseAudio()">Pause</button>
  </div>
</div>

<div class="tracklist">
  <div class="track" onclick="loadTrack('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3','Lo-Fi Chill')">
    🎵 Lo-Fi Chill
  </div>

  <div class="track" onclick="loadTrack('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3','Deep Focus')">
    🎵 Deep Focus
  </div>

  <div class="track" onclick="loadTrack('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3','Night Vibes')">
    🎵 Night Vibes
  </div>
</div>

<script>
let audio = document.getElementById("audio");
let source = document.getElementById("source");
let title = document.getElementById("title");

function loadTrack(url, name) {
  source.src = url;
  audio.load();
  audio.play();
  title.innerText = name;
}

function playAudio() {
  audio.play();
}

function pauseAudio() {
  audio.pause();
}
</script>

</body>
</html>
