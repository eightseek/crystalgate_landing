<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hub - Music & CS2</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0f18;
  color: white;
  display: flex;
  height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: 280px;
  background: #11182b;
  padding: 20px;
  overflow-y: auto;
}

.logo {
  font-size: 22px;
  color: #1db954;
  margin-bottom: 15px;
  font-weight: bold;
}

.section-title {
  margin-top: 18px;
  margin-bottom: 10px;
  font-size: 12px;
  color: #888;
  letter-spacing: 1px;
}

/* ITEM */
.item {
  padding: 10px;
  margin-bottom: 8px;
  background: #1a2238;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
  font-size: 14px;
}

.item:hover {
  background: #2a375c;
}

/* MAIN */
.main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* PLAYER */
.player {
  width: 88%;
  max-width: 950px;
  background: #141c33;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 0 35px rgba(29,185,84,0.15);
}

.title {
  margin-bottom: 15px;
  color: #1db954;
  font-size: 18px;
}

/* VIDEO */
iframe {
  width: 100%;
  height: 520px;
  border-radius: 12px;
  border: none;
}

/* MOBILE */
@media (max-width: 768px) {
  iframe {
    height: 320px;
  }
}
</style>
</head>

<body>

<div class="sidebar">
  <div class="logo">⚡ HUB</div>

  <div class="section-title">🎵 MUSIC</div>
  <div id="music"></div>

  <div class="section-title">🎮 CS2 HUB</div>
  <div id="cs2"></div>
</div>

<div class="main">
  <div class="player">
    <div class="title" id="title">Select something</div>
    <iframe id="player" src=""></iframe>
  </div>
</div>

<script>

/* 🎵 MUSIC (Drake stable) */
const music = [
  {name:"Drake - God's Plan", id:"xpVfcZ0ZcFM"},
  {name:"Drake - Hotline Bling", id:"uxpDa-c-4Mc"},
  {name:"Drake - In My Feelings", id:"DRS_PpOrUZ4"},
  {name:"Drake - Nice For What", id:"U9BwWKXjVaI"},
  {name:"Drake - Nonstop", id:"6ONRf7h3Mdk"},
  {name:"Drake - Passionfruit", id:"EgfsXTOn_pI"},
  {name:"Drake - Hold On We're Going Home", id:"7e9pQ3Q1Xn4"}
];

/* 🎮 CS2 (FIXED + safer embeds) */
const cs2 = [
  {name:"CS2 - NAVI vs Vitality Highlights", id:"SkmPSdhClww"},
  {name:"CS2 - FaZe vs Vitality Grand Final", id:"Fu2yFoiCdxE"},
  {name:"CS2 - Major Highlights 2025", id:"cbiggQkh2FI"},
  {name:"CS2 - Best Clutch Moments", id:"Q7Z4gq8m2eA"},
  {name:"CS2 - Pro Plays Compilation", id:"kXYiU_JCYtU"}
];

let player = document.getElementById("player");
let title = document.getElementById("title");

function add(list, container){
  let el = document.getElementById(container);

  list.forEach((t)=>{
    let div = document.createElement("div");
    div.className = "item";
    div.innerText = t.name;

    div.onclick = () => {
      title.innerText = t.name;
      player.src = "https://www.youtube.com/embed/" + t.id + "?autoplay=1&rel=0";
    };

    el.appendChild(div);
  });
}

add(music, "music");
add(cs2, "cs2");

</script>

</body>
</html>
