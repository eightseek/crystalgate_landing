<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeoSound - Audio Platform</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0a0a0f;
  color: white;
}

/* TOP NAV */
nav {
  display: flex;
  justify-content: space-between;
  padding: 20px 40px;
  background: #0f0f1a;
  border-bottom: 1px solid #1f1f2e;
}

.logo {
  font-weight: bold;
  color: #00ffd5;
}

nav a {
  color: #aaa;
  margin-left: 20px;
  text-decoration: none;
}

nav a:hover {
  color: white;
}

/* HERO */
.hero {
  text-align: center;
  padding: 80px 20px;
  background: radial-gradient(circle at top, #1a1a2e, #0a0a0f);
}

.hero h1 {
  font-size: 50px;
  margin-bottom: 10px;
}

.hero p {
  color: #aaa;
  font-size: 18px;
}

/* SEARCH BAR */
.search {
  margin-top: 25px;
}

.search input {
  width: 300px;
  padding: 12px;
  border-radius: 8px;
  border: none;
  outline: none;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  padding: 50px;
}

.card {
  background: #141427;
  padding: 20px;
  border-radius: 12px;
  transition: 0.3s;
  border: 1px solid #222;
}

.card:hover {
  transform: translateY(-5px);
  border-color: #00ffd5;
}

.play {
  background: #00ffd5;
  color: black;
  border: none;
  padding: 10px 15px;
  margin-top: 10px;
  border-radius: 8px;
  cursor: pointer;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 30px;
  color: #555;
  border-top: 1px solid #1f1f2e;
}
</style>
</head>

<body>

<nav>
  <div class="logo">NeoSound</div>
  <div>
    <a href="#">Home</a>
    <a href="#">Trending</a>
    <a href="#">Library</a>
  </div>
</nav>

<div class="hero">
  <h1>Stream Audio Instantly</h1>
  <p>High quality sound • Fast streaming • No limits</p>

  <div class="search">
    <input type="text" placeholder="Search music, podcasts...">
  </div>
</div>

<div class="grid">

  <div class="card">
    <h3>Lo-Fi Beats</h3>
    <p>Relax & study music</p>
    <button class="play">Play</button>
  </div>

  <div class="card">
    <h3>Tech Podcast</h3>
    <p>Latest tech talks</p>
    <button class="play">Play</button>
  </div>

  <div class="card">
    <h3>Deep Focus</h3>
    <p>Productivity sounds</p>
    <button class="play">Play</button>
  </div>

</div>

<footer>
  © 2026 NeoSound - Streaming Platform UI
</footer>

</body>
</html>
